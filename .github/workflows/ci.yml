name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled
      - unlabeled
  push:
    branches: [production]

# A newer push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  checks:
    name: Lint, format, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every gate reports in a single run, so one push surfaces every problem
      # instead of one per round trip. A failed step still fails the job.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Format
        if: ${{ !cancelled() }}
        run: pnpm exec prettier --check .

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No API_BASE_URL on purpose. The build logs backend fetch failures and
      # still exits 0, so CI does not depend on the production API being up.
      - name: Build
        run: pnpm build

  risk:
    name: Risk tier
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.risk.outputs.tier }}
      changed_lines: ${{ steps.risk.outputs.changed_lines }}
      high_paths: ${{ steps.risk.outputs.high_paths }}
      author: ${{ steps.risk.outputs.author }}
      head_sha: ${{ steps.risk.outputs.head_sha }}
      draft: ${{ steps.risk.outputs.draft }}
      labels: ${{ steps.risk.outputs.labels }}
      review_record: ${{ steps.risk.outputs.review_record }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Classify changed files
        id: risk
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/auto-merge.mjs risk

  gate:
    name: Auto-merge gate
    needs: [checks, build, risk]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Decide and act
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEEDS: ${{ toJSON(needs) }}
          CI_JOBS: checks,build
          TIER: ${{ needs.risk.outputs.tier }}
          CHANGED_LINES: ${{ needs.risk.outputs.changed_lines }}
          HIGH_PATHS: ${{ needs.risk.outputs.high_paths }}
          AUTHOR: ${{ needs.risk.outputs.author }}
          HEAD_SHA: ${{ needs.risk.outputs.head_sha }}
          DRAFT: ${{ needs.risk.outputs.draft }}
          LABELS: ${{ needs.risk.outputs.labels }}
          REVIEW_RECORD: ${{ needs.risk.outputs.review_record }}
        run: node .github/scripts/auto-merge.mjs gate

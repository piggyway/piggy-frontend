name: CI

on:
  pull_request:
  push:
    branches: [production]

# A newer push to the same PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  checks:
    name: Lint, format, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every gate reports in a single run, so one push surfaces every problem
      # instead of one per round trip. A failed step still fails the job.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Format
        if: ${{ !cancelled() }}
        run: pnpm exec prettier --check .

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No API_BASE_URL on purpose. The build logs backend fetch failures and
      # still exits 0, so CI does not depend on the production API being up.
      - name: Build
        run: pnpm build
